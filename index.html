<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Anksiyete Günlüğü — Sakin</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#8b85c4">
<meta name="application-name" content="Anksiyete Günlüğü">
<meta name="apple-mobile-web-app-title" content="Anksiyete Günlüğü">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./style.css?v=1.2.0">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="titles">
      <p class="eyebrow">Sakin</p>
      <h1>Anksiyete günlüğü</h1>
    </div>
    <button class="icon-btn" id="theme-quick-toggle" aria-label="Temayı değiştir">🌙</button>
  </header>

  <button class="panic-cta" id="home-panic-btn">
    <span class="pulse">🫶</span>
    <span class="txt"><b>Şu an zorlanıyorum</b><span>Nefes egzersizi ve destek için dokun</span></span>
  </button>

  <main>
    <section class="view active" id="view-today"></section>
    <section class="view" id="view-panic"></section>
    <section class="view" id="view-history"></section>
    <section class="view" id="view-charts"></section>
    <section class="view" id="view-progress"></section>
    <section class="view" id="view-settings"></section>
  </main>

</div>

<nav class="bottom">
  <div class="navwrap">
    <button class="nav-item active" data-view="today"><span class="nav-ic">📝</span>Bugün</button>
    <button class="nav-item" data-view="panic"><span class="nav-ic">🫶</span>Atak Modu</button>
    <button class="nav-item" data-view="history"><span class="nav-ic">🗂️</span>Kayıtlar</button>
    <button class="nav-item" data-view="charts"><span class="nav-ic">📊</span>Grafikler</button>
    <button class="nav-item" data-view="progress"><span class="nav-ic">🏆</span>İlerleme</button>
    <button class="nav-item" data-view="settings"><span class="nav-ic">⚙️</span>Ayarlar</button>
  </div>
</nav>

<div id="panic-overlay" style="display:none;"></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script src="./app.js?v=1.2.0"></script>
</body>
</html>
